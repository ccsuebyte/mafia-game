<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mafia Game</title>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<style>

body{
font-family:system-ui;
background:#0f0f0f;
color:white;
text-align:center;
padding:20px;
}

button{
padding:10px 16px;
margin:5px;
border-radius:10px;
border:none;
background:#ff4d4d;
color:white;
}

input{
padding:10px;
margin:5px;
border-radius:8px;
border:none;
}

.player{
background:#1f1f1f;
padding:10px;
margin:5px;
border-radius:8px;
}

.timer{
font-size:40px;
margin:10px;
}

</style>

</head>

<body>

<h1>MAFIA</h1>

<div id="join">

<input id="room" placeholder="Room Code"><br>
<input id="name" placeholder="Your Name"><br>

<button onclick="join()">Join Game</button>

</div>

<div id="lobby" style="display:none">

<h2>Lobby</h2>

<div id="players"></div>

<button onclick="startGame()">Start Game</button>

</div>

<div id="game" style="display:none">

<h2 id="role"></h2>

<h3 id="phase"></h3>

<div class="timer" id="timer"></div>

<div id="voteArea"></div>

</div>

<script>

let peer
let connections=[]
let players={}
let playerId=Math.random().toString(36).slice(2)
let name
let room

function join(){

name=document.getElementById("name").value
room=document.getElementById("room").value

peer=new Peer(room+"-"+playerId)

peer.on("open",id=>{

document.getElementById("join").style.display="none"
document.getElementById("lobby").style.display="block"

players[id]={name:name}

updatePlayers()

})

peer.on("connection",conn=>{

connections.push(conn)

conn.on("data",data=>{

if(data.type==="join"){
players[data.id]=data.player
updatePlayers()
broadcast()
}

})

})

setTimeout(connectToRoom,1000)

}

function connectToRoom(){

let conn=new Peer().connect(room+"-host")

conn.on("open",()=>{

conn.send({
type:"join",
id:playerId,
player:{name:name}
})

})

}

function updatePlayers(){

let html=""

Object.values(players).forEach(p=>{

html+=`<div class="player">${p.name}</div>`

})

document.getElementById("players").innerHTML=html

}

function broadcast(){

connections.forEach(c=>{

c.send({
type:"update",
players:players
})

})

}

function startGame(){

let ids=Object.keys(players)

let roles=[]

let mafiaCount=ids.length>5?2:1

for(let i=0;i<mafiaCount;i++) roles.push("Mafia")

roles.push("Police")
roles.push("Doctor")

while(roles.length<ids.length) roles.push("Citizen")

roles.sort(()=>Math.random()-0.5)

ids.forEach((id,i)=>{

players[id].role=roles[i]

})

let myRole=players[peer.id].role

document.getElementById("role").innerText="You are: "+myRole

document.getElementById("lobby").style.display="none"
document.getElementById("game").style.display="block"

startTimer("Mafia Meeting",60)

}

function startTimer(label,time){

document.getElementById("phase").innerText=label

let t=time

let interval=setInterval(()=>{

document.getElementById("timer").innerText=t

t--

if(t<0){

clearInterval(interval)

}

},1000)

}

</script>

</body>
</html>
